<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>古韵抽卡 · 一图一诗</title>
  <meta name="description" content="一图一诗 · 随机古诗词配意境美图 · 可下载分享">
  <meta name="theme-color" content="#faf8f4">
  <meta name="color-scheme" content="light dark">

  <!-- icons（多格式 fallback：SVG → ICO → PNG） -->
  <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg">
  <link rel="icon" type="image/x-icon" sizes="any" href="./assets/icons/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">

  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="pc-page">
    <header class="pc-header">
      <div class="pc-header-text">
        <h1 class="pc-brand">古韵抽卡</h1>
        <p class="pc-tagline">一图一诗 · 且听风吟</p>
      </div>
      <button id="pc-theme-toggle" class="pc-theme-btn" type="button" title="切换主题">自动</button>
    </header>

    <div id="pc-degraded" class="pc-degraded" role="alert">
      <span class="pc-degraded-msg"></span>
      <button id="pc-recover" class="pc-degraded-btn" type="button">重试恢复</button>
    </div>

    <main class="pc-main">
      <!-- 明信片 / 骨架屏 -->
      <section id="pc-stage" class="pc-stage" aria-live="polite"></section>

      <!-- 模式切换：本地优先 -->
      <div class="pc-mode-row">
        <button id="pc-local-first" class="pc-btn pc-btn--toggle" type="button" aria-pressed="false" title="开启后优先使用本地诗词库（离线可用）">
          本地优先
        </button>
      </div>

      <!-- 操作区 -->
      <div class="pc-actions">
        <button id="pc-draw" class="pc-btn pc-btn--primary" type="button">
          <span class="pc-btn-spinner" aria-hidden="true"></span>
          <span class="pc-btn-label">换一张</span>
        </button>
        <button id="pc-download" class="pc-btn" type="button">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true">
            <path d="M12 16l-5-5 1.41-1.41L11 12.17V4h2v8.17l2.59-2.58L17 11l-5 5zm-7 2h14v2H5v-2z"/>
          </svg>
          下载卡片
        </button>
        <button id="pc-share" class="pc-btn" type="button">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true">
            <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81a3 3 0 1 0-3-3c0 .24.04.47.09.7L8.04 9.81A3 3 0 1 0 6 15c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65a2.92 2.92 0 1 0 2.92-2.92z"/>
          </svg>
          分享
        </button>
      </div>

      <p class="pc-hint">
        <span id="pc-source-note" class="pc-source-note"></span>
        <span class="pc-kbd-hint">点图右上角 <kbd>↻</kbd> 换图 · 按 <kbd>空格</kbd> 换诗</span>
      </p>
    </main>

    <footer class="pc-footer">
      诗 · <a href="https://poetry.palemoky.com/" target="_blank" rel="noopener">诗泉 API</a>
      <span class="pc-dot">·</span>
      图 · LoremFlickr
    </footer>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
