<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>古韵抽卡 · Poetry Cards</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="pc-header">
    <h1>古韵抽卡</h1>
    <div class="pc-subtitle">一签一诗 · 国风宣纸</div>
  </header>

  <section class="pc-controls">
    <select id="pc-category" class="pc-select" aria-label="分类筛选">
      <option value="all">全部</option>
    </select>
    <button id="pc-draw" class="pc-btn-primary">抽 一 签</button>
  </section>

  <section class="pc-card-slot" id="pc-card-slot">
    <p style="color:var(--ink-soft)">点击「抽一签」开启你的诗词之旅</p>
  </section>

  <section class="pc-gallery-section">
    <div class="pc-section-header">
      <h3>抽到的签</h3>
      <span>
        <span id="pc-gallery-count">共 0 张</span>
        <button id="pc-clear" class="pc-link-btn" style="margin-left:12px">清空历史</button>
      </span>
    </div>
    <div id="pc-gallery" class="pc-gallery"></div>
  </section>

  <section class="pc-gallery-section">
    <div class="pc-section-header">
      <h3>收藏夹</h3>
    </div>
    <div id="pc-favorites-panel" class="pc-favorites-panel"></div>
  </section>

  <footer class="pc-footer">
    数据来源 <a href="https://gitee.com/li-luoqiang/chinese-poetry" target="_blank" rel="noopener">chinese-poetry</a>
    · 单页 Web · MIT
  </footer>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
