<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>古韵抽卡 · 一图一诗</title>
  <meta name="description" content="一图一诗 · 随机古诗词配意境美图 · 可下载分享">
  <meta name="theme-color" content="#faf8f4">
  <meta name="color-scheme" content="light dark">

  <!-- icons（多格式 fallback：SVG → ICO → PNG） -->
  <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg">
  <link rel="icon" type="image/x-icon" sizes="any" href="./assets/icons/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">

  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="pc-page">
    <header class="pc-header">
      <div class="pc-header-text">
        <h1 class="pc-brand">古韵抽卡</h1>
        <p class="pc-tagline">一图一诗 · 且听风吟</p>
      </div>
      <div class="pc-header-actions">
        <div class="pc-switch" id="pc-local-first" role="switch" tabindex="0"
             aria-checked="true"
             aria-label="诗源切换：典藏诗库 / 随机一遇"
             title="典藏诗库 · 仅取千年传诵的经典诗词">
          <span class="pc-switch-label pc-switch-label--current" data-on="典藏诗库">典藏诗库</span>
          <span class="pc-switch-track" aria-hidden="true">
            <span class="pc-switch-thumb"></span>
          </span>
        </div>
        <button id="pc-theme-toggle" class="pc-btn pc-btn--header pc-btn--icon" type="button" title="主题：自动（点击切换）" aria-label="切换主题">
          <span class="pc-theme-icon" aria-hidden="true">
            <!-- v4.1.7: 3 个图标(自动/太阳/月亮),由 data-theme-mode 切换显示 -->
            <svg class="pc-theme-icon-auto" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <!-- 自动 = 屏幕(矩形) + 系统圆 + 连接线, 暗示"屏幕追随系统" -->
              <rect x="3" y="5" width="13" height="10" rx="1.5"/>
              <circle cx="18" cy="17" r="3"/>
              <path d="M13 16.5L15 16.5"/>
            </svg>
            <svg class="pc-theme-icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
            </svg>
            <svg class="pc-theme-icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </span>
        </button>
      </div>
    </header>

    <div id="pc-degraded" class="pc-degraded" role="alert">
      <span class="pc-degraded-msg"></span>
      <button id="pc-recover" class="pc-degraded-btn" type="button">重试恢复</button>
    </div>

    <main class="pc-main">
      <!-- 明信片 / 骨架屏 -->
      <section id="pc-stage" class="pc-stage" aria-live="polite"></section>

      <!-- 操作区 -->
      <div class="pc-actions">
        <button id="pc-draw" class="pc-btn pc-btn--primary" type="button">
          <span class="pc-btn-spinner" aria-hidden="true"></span>
          <span class="pc-btn-label">换一张</span>
        </button>
        <button id="pc-download" class="pc-btn" type="button">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true">
            <path d="M12 16l-5-5 1.41-1.41L11 12.17V4h2v8.17l2.59-2.58L17 11l-5 5zm-7 2h14v2H5v-2z"/>
          </svg>
          下载卡片
        </button>
        <button id="pc-share" class="pc-btn" type="button">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true">
            <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81a3 3 0 1 0-3-3c0 .24.04.47.09.7L8.04 9.81A3 3 0 1 0 6 15c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65a2.92 2.92 0 1 0 2.92-2.92z"/>
          </svg>
          分享
        </button>
        <button id="pc-memory-open" class="pc-btn" type="button" aria-label="打开记忆面板" title="收藏 / 历史 / 统计">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true">
            <path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
          </svg>
          记忆
        </button>
        <a id="pc-festival-open" class="pc-btn" href="./festival.html" title="贺卡模式 · 节日送礼" aria-label="打开贺卡模式">
          <span aria-hidden="true">🎴</span>
          贺卡
        </a>
      </div>

      <p class="pc-hint">
        <span id="pc-source-note" class="pc-source-note"></span>
        <span class="pc-kbd-hint">点图右上角 <kbd>↻</kbd> 换图 · 按 <kbd>空格</kbd> 换诗</span>
      </p>
    </main>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
